<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Beachfront</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Georgia', serif;
      background: linear-gradient(135deg, #0f4c81 0%, #1a6ea8 50%, #2e9fd3 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 700px;
    }

    h1 {
      font-size: 3rem;
      letter-spacing: 0.05em;
      margin-bottom: 1rem;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    p {
      font-size: 1.25rem;
      line-height: 1.8;
      opacity: 0.9;
      margin-bottom: 2rem;
    }

    .wave {
      font-size: 2rem;
      animation: sway 2s ease-in-out infinite;
      display: inline-block;
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-5deg); }
      50%       { transform: rotate(5deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="wave">🌊</div>
    <h1>Private Beachfront</h1>
    <p>Welcome to your exclusive beachfront retreat. Sit back, relax, and enjoy the view.</p>
  </div>
</body>
</html>
